<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06080f">
<meta name="description" content="Aura Roll - roll for auras, chase 1 in a billion odds, equip them and flex.">
<title>Aura Roll</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Aura Roll">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="stagewrap"><canvas id="stage"></canvas></div>

  <header id="hud">
    <div class="brand"><span class="b1">AURA</span><span class="b2">ROLL</span><span class="ver">v1.2</span><button class="ownertag hidden" title="Owner admin panel">OWNER</button></div>
    <div class="stats">
      <button class="stat cloud out" id="cloudPill" title="Cloud save"><i class="cd"></i><b>SIGN IN</b></button>
      <div class="stat" title="Coins"><svg class="ic"><use href="#i-coin"/></svg><b id="coins">0</b></div>
      <div class="stat" title="Total luck multiplier"><svg class="ic"><use href="#i-luck"/></svg><b id="luck">x1.00</b></div>
      <div class="stat hide-s" title="Total rolls"><svg class="ic"><use href="#i-dice"/></svg><b id="rolls">0</b></div>
    </div>
  </header>

  <div id="status">
    <div id="biomeBadge"></div>
    <div id="potions"></div>
  </div>

  <div id="reveal" class="hidden"></div>
  <div id="cine" class="hidden"></div>

  <div id="rollzone">
    <div id="equipped"></div>
    <div id="recent"></div>
    <div class="rollrow">
      <button id="auto" class="side locked" title="Auto roll (A)"><svg class="ic"><use href="#i-loop"/></svg><span>AUTO</span></button>
      <button id="roll"><div id="cdfill"></div><span id="rollTxt">ROLL</span><small id="rollHint">SPACE</small></button>
      <button id="quick" class="side" title="Skip long animations (Q)"><svg class="ic"><use href="#i-bolt"/></svg><span>QUICK</span></button>
    </div>
  </div>

  <nav id="tabs">
    <button data-tab="bag"><svg class="ic"><use href="#i-bag"/></svg><span>BAG</span></button>
    <button data-tab="index"><svg class="ic"><use href="#i-book"/></svg><span>INDEX</span></button>
    <button data-tab="shop"><svg class="ic"><use href="#i-cart"/></svg><span>SHOP</span></button>
    <button data-tab="goals"><svg class="ic"><use href="#i-trophy"/></svg><span>GOALS</span></button>
    <button data-tab="more"><svg class="ic"><use href="#i-gear"/></svg><span>MORE</span></button>
  </nav>

  <aside id="panel" class="closed">
    <div class="phead"><h2 id="panelTitle"></h2><button id="panelClose" aria-label="Close">&times;</button></div>
    <div id="panelBody"></div>
  </aside>

  <div id="modal" class="hidden"><div class="mbox" id="mbox"></div></div>
  <div id="toasts"></div>
  <div id="start"><div class="startbox">
    <div class="logo"><span class="b1">AURA</span><span class="b2">ROLL</span></div>
    <p>Roll for auras. Chase the impossible odds.<br>Equip your best and flex it.</p>
    <button id="startBtn">PLAY</button>
    <button id="startSignIn" class="ghostbtn">SIGN IN WITH GOOGLE TO SAVE ONLINE</button>
    <small id="startSave"></small>
  </div></div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 6.5v11M9 9.5c0-1.3 1.3-2 3-2s3 .7 3 2-1.3 1.8-3 2.2-3 .9-3 2.3 1.3 2 3 2 3-.7 3-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-luck" viewBox="0 0 24 24"><path d="M12 2l2.6 6.4L21.5 9l-5.2 4.5L18 20.5 12 17l-6 3.5 1.7-7L2.5 9l6.9-.6z" fill="currentColor"/></symbol>
    <symbol id="i-dice" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8.5" cy="8.5" r="1.6" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></symbol>
    <symbol id="i-loop" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.7M20 4v4.7h-4.7M20 12a8 8 0 0 1-13.7 5.6L4 15.3M4 20v-4.7h4.7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2L5 13.5h6L10 22l9-12.5h-6.5z" fill="currentColor"/></symbol>
    <symbol id="i-bag" viewBox="0 0 24 24"><path d="M5 8h14l1 12.5H4z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M9 8V6a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 4.5h6.5a2 2 0 0 1 1.5 .7 2 2 0 0 1 1.5-.7H20v14.5h-6.5a2 2 0 0 0-1.5 1 2 2 0 0 0-1.5-1H4z" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"/><path d="M12 5.2V20" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-cart" viewBox="0 0 24 24"><path d="M2.5 4h3l2.5 11h10.5l2-8H6.3" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9.5" cy="19.5" r="1.7" fill="currentColor"/><circle cx="17" cy="19.5" r="1.7" fill="currentColor"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 3.5h10v6a5 5 0 0 1-10 0zM7 5.5H3.5c0 3 1.5 4.5 3.5 4.7M17 5.5h3.5c0 3-1.5 4.5-3.5 4.7M12 14.5v3.5M8 20.5h8M9 18h6" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<script src="js/data.js"></script>
<script src="js/fx.js"></script>
<script src="js/stage.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/cloud.js"></script>
<script src="js/ui.js"></script>
<script src="js/admin.js"></script>
<script src="js/cutscene.js"></script>
<script src="js/main.js"></script>
</body>
</html>
